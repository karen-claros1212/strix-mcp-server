[project]
name = "strix-mcp-server"
version = "0.2.0a1"
description = "MCP server that exposes a curated subset of Strix tools via Model Context Protocol with allowlist-based security"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["mcp", "strix", "security", "pentesting", "cybersecurity"]
dependencies = [
    "mcp>=1.26.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
strix-mcp = "strix_mcp_server.server:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["strix_mcp_server*"]

[tool.ruff]
target-version = "py312"
line-length = 120
