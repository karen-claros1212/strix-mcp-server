[project]
name = "strix-mcp-server"
version = "0.1.0"
description = "MCP server that exposes Strix tools via Model Context Protocol"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.26.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "defusedxml>=0.7.1",
]

[project.scripts]
strix-mcp = "strix_mcp_server.server:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["strix_mcp_server*"]
